services:
  - type: web
    name: nexora-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Nexora Group
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        # Render no expone la URL final del sitio estático como referencia
        # cross-service con esquema incluido; se completa a mano tras el primer
        # deploy (https://nexora-frontend-xxxx.onrender.com).
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: EVIDENCE_BACKEND
        value: none
      - key: MAX_EVIDENCE_MB
        value: "25"

  - type: web
    name: nexora-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        # Debe apuntar a la URL pública del backend (distinto subdominio en
        # Render), p.ej. https://nexora-backend-xxxx.onrender.com/api.
        # Vite solo lee VITE_* en build time, así que hay que fijarlo aquí y
        # disparar un nuevo build tras conocer la URL real del backend.
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nexora-postgres
    plan: free
    databaseName: nexora
    user: nexora
