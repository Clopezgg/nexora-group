name: Trigger Azure DEV Deploy Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-deploy-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected Azure DEV workflow
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Azure with explicit authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-azure.yml/dispatches" \
            --data '{"ref":"main","inputs":{"deploy":"true","reason":"Authorized publish of current main after integrated product hardening"}}'
