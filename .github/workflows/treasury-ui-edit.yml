name: Apply Treasury account UI patch

on:
  push:
    branches: [fix/treasury-account-ui]
    paths:
      - ".github/workflows/treasury-ui-edit.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/treasury-account-ui
          fetch-depth: 1

      - name: Apply focused Treasury account setup changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          treasury_page = "frontend/src/features/treasury/TreasuryPage.tsx"

          replace_once(
              treasury_page,
              "  ErrorState,\n  LoadingState,",
              "  ErrorState,\n  Input,\n  LoadingState,",
          )

          replace_once(
              treasury_page,
              "import type { Remittance, TreasuryAccount } from '../../types/treasury'\nimport { formatMoney } from '../../utils/currency'",
              "import type { Account } from '../../types/masterData'\nimport type { Remittance, TreasuryAccount } from '../../types/treasury'\nimport { formatMoney } from '../../utils/currency'\nimport { useAuth } from '../auth/auth-context'",
          )

          replace_once(
              treasury_page,
              "type ModalKind = 'remittance' | 'expense' | 'transfer' | null\nconst REMITTANCE_PAGE_SIZE = 25",
              "type ModalKind = 'account' | 'remittance' | 'expense' | 'transfer' | null\nconst REMITTANCE_PAGE_SIZE = 25\nconst CREATE_TREASURY_ACCOUNT_ROLES = new Set(['Administrator', 'Finance Manager'])\nconst TREASURY_KIND_LABELS: Record<TreasuryAccount['kind'], string> = {\n  BANK: 'Banco',\n  CASH: 'Caja',\n  OTHER: 'Otra',\n}",
          )

          replace_once(
              treasury_page,
              "export function TreasuryPage() {\n  const queryClient = useQueryClient()",
              "export function TreasuryPage() {\n  const { user } = useAuth()\n  const queryClient = useQueryClient()",
          )

          replace_once(
              treasury_page,
              "  const glAccounts = accountsQuery.data ?? []\n  const treasuryAccounts = treasuryAccountsQuery.data ?? []\n  const remittances = remittancesQuery.data ?? []",
              "  const glAccounts = accountsQuery.data ?? []\n  const treasuryAccounts = treasuryAccountsQuery.data ?? []\n  const remittances = remittancesQuery.data ?? []\n  const assignedGlAccountIds = new Set(treasuryAccounts.map((account) => account.glAccountId))\n  const availableTreasuryGlAccounts = glAccounts.filter(\n    (account) =>\n      account.isPostable &&\n      account.accountType === 'ASSET' &&\n      !assignedGlAccountIds.has(account.id),\n  )\n  const canCreateTreasuryAccount = Boolean(\n    user?.roles.some((role) => CREATE_TREASURY_ACCOUNT_ROLES.has(role)),\n  )",
          )

          replace_once(
              treasury_page,
              "    { key: 'kind', header: 'Tipo', render: (row) => row.kind },",
              "    { key: 'kind', header: 'Tipo', render: (row) => TREASURY_KIND_LABELS[row.kind] ?? row.kind },",
          )

          replace_once(
              treasury_page,
              "  const remittanceCounterAccounts = glAccounts.filter(\n    (account) => !treasuryAccounts.some((treasuryAccount) => treasuryAccount.glAccountId === account.id),\n  )",
              "  const remittanceCounterAccounts = glAccounts.filter(\n    (account) => account.isPostable && !assignedGlAccountIds.has(account.id),\n  )",
          )

          replace_once(
              treasury_page,
              "      <Card title=\"Cuentas de Tesorería\">\n        {treasuryAccountsQuery.isLoading ? (",
              "      <Card title=\"Cuentas de Tesorería\">\n        {canCreateTreasuryAccount ? (\n          <div className=\"nx-treasury__actions\">\n            <Button onClick={() => setOpenModal('account')}>Nueva cuenta de Tesorería</Button>\n          </div>\n        ) : null}\n        {treasuryAccountsQuery.isLoading ? (",
          )

          replace_once(
              treasury_page,
              "      {openModal === 'remittance' && activeCompanyId ? (",
              "      {openModal === 'account' && activeCompanyId ? (\n        <TreasuryAccountModal\n          companyId={activeCompanyId}\n          glAccounts={availableTreasuryGlAccounts}\n          onClose={() => setOpenModal(null)}\n        />\n      ) : null}\n      {openModal === 'remittance' && activeCompanyId ? (",
          )

          replace_once(
              treasury_page,
              "          expenseAccounts={glAccounts.filter((a) => a.accountType === 'EXPENSE')}",
              "          expenseAccounts={glAccounts.filter((a) => a.isPostable && a.accountType === 'EXPENSE')}",
          )

          modal_code = r'''
function TreasuryAccountModal({
  companyId,
  glAccounts,
  onClose,
}: {
  companyId: string
  glAccounts: Account[]
  onClose: () => void
}) {
  const queryClient = useQueryClient()
  const [name, setName] = useState('')
  const [kind, setKind] = useState<TreasuryAccount['kind']>('BANK')
  const [currencyCode, setCurrencyCode] = useState('HNL')
  const [glAccountId, setGlAccountId] = useState(glAccounts[0]?.id ?? '')
  const [institution, setInstitution] = useState('')
  const [accountReference, setAccountReference] = useState('')

  const mutation = useMutation({
    mutationFn: () =>
      treasuryService.createAccount({
        companyId,
        name: name.trim(),
        kind,
        currencyCode,
        glAccountId,
        institution: institution.trim() || null,
        accountReference: accountReference.trim() || null,
      }),
    onSuccess: () => {
      queryClient.invalidateQueries({ queryKey: ['treasury', 'accounts', companyId] })
      onClose()
    },
  })

  if (glAccounts.length === 0) {
    return (
      <Modal open title="Nueva cuenta de Tesorería" onClose={onClose}>
        <EmptyState
          icon="bank"
          title="No hay cuentas contables disponibles"
          description="Crea primero una cuenta contable registrable de tipo Activo, como 1102 Bancos — HNL o 1101 Caja y efectivo. Las cuentas agrupadoras no pueden vincularse a Tesorería."
        />
      </Modal>
    )
  }

  return (
    <Modal open title="Nueva cuenta de Tesorería" onClose={onClose}>
      <form
        className="nx-treasury__form"
        onSubmit={(event) => {
          event.preventDefault()
          mutation.mutate()
        }}
      >
        <Input
          name="treasuryAccountName"
          label="Nombre de la cuenta"
          value={name}
          onChange={(event) => setName(event.target.value)}
          placeholder={kind === 'CASH' ? 'Ej. Caja general' : 'Ej. Banco principal HNL'}
          required
        />
        <Select
          name="treasuryAccountKind"
          label="Tipo de cuenta"
          value={kind}
          onChange={(event) => setKind(event.target.value as TreasuryAccount['kind'])}
          required
        >
          {Object.entries(TREASURY_KIND_LABELS).map(([value, label]) => (
            <option key={value} value={value}>
              {label}
            </option>
          ))}
        </Select>
        <Select
          name="currencyCode"
          label="Moneda"
          value={currencyCode}
          onChange={(event) => setCurrencyCode(event.target.value)}
          required
        >
          <option value="HNL">HNL — Lempira hondureño</option>
          <option value="USD">USD — Dólar estadounidense</option>
        </Select>
        <Select
          name="glAccountId"
          label="Cuenta contable vinculada"
          value={glAccountId}
          onChange={(event) => setGlAccountId(event.target.value)}
          required
        >
          {glAccounts.map((account) => (
            <option key={account.id} value={account.id}>
              {account.code} · {account.name}
            </option>
          ))}
        </Select>
        <p className="nx-field__hint">
          Solo aparecen cuentas registrables de tipo Activo que todavía no están vinculadas a otra
          cuenta de Tesorería.
        </p>
        <Input
          name="institution"
          label="Institución"
          value={institution}
          onChange={(event) => setInstitution(event.target.value)}
          placeholder="Opcional, ej. Banco de Occidente"
        />
        <Input
          name="accountReference"
          label="Referencia / número de cuenta"
          value={accountReference}
          onChange={(event) => setAccountReference(event.target.value)}
          placeholder="Opcional"
        />
        {mutation.isError ? (
          <p className="nx-field__error" role="alert">
            {(mutation.error as Error).message}
          </p>
        ) : null}
        <Button
          type="submit"
          loading={mutation.isPending}
          disabled={!name.trim() || !glAccountId || !currencyCode}
        >
          Crear cuenta de Tesorería
        </Button>
      </form>
    </Modal>
  )
}

'''
          replace_once(
              treasury_page,
              "function RemittanceModal({",
              modal_code + "function RemittanceModal({",
          )

          service = "frontend/src/services/treasuryService.ts"
          replace_once(
              service,
              "export interface CreateTreasuryAccountPayload {\n  companyId: string\n  name: string\n  kind: string\n  currencyCode: string\n  glAccountId: string\n}",
              "export interface CreateTreasuryAccountPayload {\n  companyId: string\n  name: string\n  kind: TreasuryAccount['kind']\n  currencyCode: string\n  glAccountId: string\n  institution?: string | null\n  accountReference?: string | null\n}",
          )

          backend_service = "backend/app/services/treasury_service.py"
          replace_once(
              backend_service,
              "from app.models.accounting import AccountingDocument, JournalLine\nfrom app.models.treasury import (",
              "from app.models.accounting import AccountingDocument, JournalLine\nfrom app.models.chart_of_accounts import Account\nfrom app.models.treasury import (",
          )
          replace_once(
              backend_service,
              "    assert_account_belongs_to_company(\n        db,\n        account_id=gl_account_id,\n        company_id=company_id,\n        field_name=\"gl_account_id\",\n    )\n    existing_mapping = db.execute(",
              "    assert_account_belongs_to_company(\n        db,\n        account_id=gl_account_id,\n        company_id=company_id,\n        field_name=\"gl_account_id\",\n    )\n    gl_account = db.get(Account, gl_account_id)\n    if gl_account is None:\n        raise InvalidFinancialReferenceError(\"gl_account_id no existe\")\n    if not gl_account.is_postable:\n        raise InvalidFinancialReferenceError(\n            \"gl_account_id debe ser una cuenta registrable; las cuentas agrupadoras no pueden vincularse a Tesorería\"\n        )\n    if gl_account.account_type != \"ASSET\":\n        raise InvalidFinancialReferenceError(\n            \"gl_account_id debe ser una cuenta contable de tipo ASSET para Tesorería\"\n        )\n    existing_mapping = db.execute(",
          )

          backend_tests = Path("backend/tests/test_treasury.py")
          text = backend_tests.read_text()
          marker = "\ndef test_remittance_rejects_counter_account_equal_to_treasury_gl_account(client):\n"
          if text.count(marker) != 1:
              raise SystemExit("backend treasury test insertion marker not unique")
          new_tests = r'''

def test_treasury_account_rejects_grouping_gl_account(client):
    login_admin(client)
    company = create_company(client)
    grouping = client.post(
        "/api/master-data/accounts",
        json={
            "companyId": company["id"],
            "code": "1000",
            "name": "ACTIVOS",
            "accountType": "ASSET",
            "isPostable": False,
        },
    )
    assert grouping.status_code == 201, grouping.text

    response = client.post(
        "/api/treasury/accounts",
        json={
            "companyId": company["id"],
            "name": "Cuenta inválida",
            "kind": "BANK",
            "currencyCode": "HNL",
            "glAccountId": grouping.json()["id"],
        },
    )
    assert response.status_code == 422, response.text
    assert response.json()["error"]["code"] == "NXR-FINANCIAL-001"


def test_treasury_account_rejects_non_asset_gl_account(client):
    login_admin(client)
    company = create_company(client)
    expense = create_account(
        client,
        company_id=company["id"],
        code="6101",
        name="Gastos administrativos generales",
        account_type="EXPENSE",
    )

    response = client.post(
        "/api/treasury/accounts",
        json={
            "companyId": company["id"],
            "name": "Cuenta inválida",
            "kind": "OTHER",
            "currencyCode": "HNL",
            "glAccountId": expense["id"],
        },
    )
    assert response.status_code == 422, response.text
    assert response.json()["error"]["code"] == "NXR-FINANCIAL-001"
'''
          backend_tests.write_text(text.replace(marker, new_tests + marker, 1))

          frontend_tests = Path("frontend/tests/TreasuryPage.test.tsx")
          text = frontend_tests.read_text()
          replace_import = "import { render, screen } from '@testing-library/react'"
          if text.count(replace_import) != 1:
              raise SystemExit("frontend test import marker not unique")
          text = text.replace(
              replace_import,
              "import { render, screen, waitFor } from '@testing-library/react'",
              1,
          )
          closing = "\n})\n"
          if not text.endswith(closing):
              raise SystemExit("frontend treasury tests have unexpected ending")
          ui_test = r'''

  it('creates a Treasury account from an available postable ASSET account', async () => {
    let createdPayload: Record<string, unknown> | null = null
    vi.stubGlobal(
      'fetch',
      vi.fn().mockImplementation((input: RequestInfo | URL, init?: RequestInit) => {
        const url = String(input)
        if (url.includes('/auth/me')) {
          return Promise.resolve({
            ok: true,
            status: 200,
            json: async () => ({
              id: 'u1',
              email: 'admin@nexora.group',
              fullName: 'Admin',
              roles: ['Administrator'],
            }),
          } as Response)
        }
        if (url.includes('/master-data/companies')) {
          return Promise.resolve({
            ok: true,
            status: 200,
            json: async () => [
              {
                id: 'c1',
                name: 'NEXORA GROUP',
                code: null,
                legalName: null,
                functionalCurrencyCode: 'HNL',
                country: null,
                fiscalId: null,
              },
            ],
          } as Response)
        }
        if (url.includes('/master-data/accounts')) {
          return Promise.resolve({
            ok: true,
            status: 200,
            json: async () => [
              {
                id: 'a-bank',
                code: '1102',
                name: 'Bancos — HNL',
                accountType: 'ASSET',
                parentId: 'a-assets',
                isPostable: true,
              },
              {
                id: 'a-assets',
                code: '1000',
                name: 'ACTIVOS',
                accountType: 'ASSET',
                parentId: null,
                isPostable: false,
              },
              {
                id: 'a-expense',
                code: '6101',
                name: 'Gastos administrativos generales',
                accountType: 'EXPENSE',
                parentId: null,
                isPostable: true,
              },
            ],
          } as Response)
        }
        if (url.includes('/treasury/accounts')) {
          if (init?.method === 'POST') {
            createdPayload = JSON.parse(String(init.body)) as Record<string, unknown>
            return Promise.resolve({
              ok: true,
              status: 201,
              json: async () => ({
                id: 't1',
                companyId: 'c1',
                name: 'Banco principal HNL',
                kind: 'BANK',
                institution: 'Banco de Occidente',
                accountReference: null,
                currencyCode: 'HNL',
                glAccountId: 'a-bank',
                status: 'ACTIVE',
                balance: '0.00',
              }),
            } as Response)
          }
          return Promise.resolve({ ok: true, status: 200, json: async () => [] } as Response)
        }
        if (url.includes('/treasury/remittances')) {
          return Promise.resolve({ ok: true, status: 200, json: async () => [] } as Response)
        }
        return Promise.resolve({ ok: true, status: 200, json: async () => [] } as Response)
      }),
    )

    render(renderApp('/finanzas/tesoreria'))

    await userEvent.click(
      await screen.findByRole('button', { name: /nueva cuenta de tesorería/i }),
    )

    expect(screen.getByRole('option', { name: '1102 · Bancos — HNL' })).toBeInTheDocument()
    expect(screen.queryByRole('option', { name: /1000 · ACTIVOS/i })).not.toBeInTheDocument()
    expect(
      screen.queryByRole('option', { name: /6101 · Gastos administrativos/i }),
    ).not.toBeInTheDocument()

    await userEvent.type(screen.getByLabelText(/nombre de la cuenta/i), 'Banco principal HNL')
    await userEvent.type(screen.getByLabelText(/^institución$/i), 'Banco de Occidente')
    await userEvent.click(screen.getByRole('button', { name: /crear cuenta de tesorería/i }))

    await waitFor(() =>
      expect(createdPayload).toMatchObject({
        companyId: 'c1',
        name: 'Banco principal HNL',
        kind: 'BANK',
        currencyCode: 'HNL',
        glAccountId: 'a-bank',
        institution: 'Banco de Occidente',
      }),
    )
  })
'''
          frontend_tests.write_text(text[:-len(closing)] + ui_test + closing)
          PY

          git diff --check

      - name: Commit focused changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Nexora Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/treasury-ui-edit.yml
          git add frontend/src/features/treasury/TreasuryPage.tsx frontend/src/services/treasuryService.ts frontend/tests/TreasuryPage.test.tsx backend/app/services/treasury_service.py backend/tests/test_treasury.py
          git commit -m "feat(treasury): create company treasury accounts from UI"
          git push origin HEAD:fix/treasury-account-ui
