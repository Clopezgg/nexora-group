name: Deploy Azure

# Requiere, configurados como secrets/variables del repo antes de poder correr
# el job "deploy" (el job "validate" no los necesita):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     -> federated credential (OIDC) apuntando a este repo/rama, sin client secret.
#   POSTGRES_ADMIN_PASSWORD, BACKEND_SECRET_KEY, BOOTSTRAP_ADMIN_PASSWORD, BOOTSTRAP_ADMIN_EMAIL
#     -> GitHub Secrets, nunca en este archivo ni en el repo.
#   EDIT_ACCESS_TOKEN_SALT, EDIT_ACCESS_TOKEN_DIGEST
#     -> opcionales. Deben ser derivados fuera del repositorio y almacenados como GitHub Secrets.
#        Si falta cualquiera de los dos, Protected Edit permanece fail-closed en el backend.
# El token de despliegue de Static Web Apps se obtiene en tiempo de ejecución
# mediante la sesión OIDC y se enmascara; no se almacena como secret del repo.
#
# El job "deploy" solo puede ejecutarse mediante workflow_dispatch con el
# booleano `deploy` confirmado. Los pushes y pull requests nunca despliegan.
# Azure actual se trata como DEV; el job usa la identidad federada de main.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/deploy-azure.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Confirmo que este run puede desplegar recursos Azure DEV"
        required: true
        type: boolean
        default: false
      diagnose:
        description: "Recopilar diagnóstico seguro de la revisión actual sin desplegar"
        required: true
        type: boolean
        default: false
      reason:
        description: "Motivo o cambio que autoriza este despliegue"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: nexora-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Bicep what-if
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure OIDC secrets
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -z "${{ secrets.AZURE_TENANT_ID }}" ] || [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::Required Azure OIDC secrets are not configured"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (no crea recursos)
        run: |
          az deployment sub what-if \
            --name nexora-ci-whatif \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters \
              postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}' \
              backendSecretKey='${{ secrets.BACKEND_SECRET_KEY }}' \
              bootstrapAdminPassword='${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}' \
              bootstrapAdminEmail='${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}' \
              editAccessTokenSalt='${{ secrets.EDIT_ACCESS_TOKEN_SALT }}' \
              editAccessTokenDigest='${{ secrets.EDIT_ACCESS_TOKEN_DIGEST }}'

  diagnose:
    name: Diagnose Azure backend revision
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Collect revision state and non-secret logs
        run: |
          set -uo pipefail
          APP=nexora-backend-dev
          RG=nexora-rg-dev
          LATEST_REVISION="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)"

          echo "latest_revision=$LATEST_REVISION"
          az containerapp show -g "$RG" -n "$APP" \
            --query '{provisioning:properties.provisioningState,running:properties.runningStatus,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,traffic:properties.configuration.ingress.traffic}' -o json
          az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST_REVISION" \
            --query '{health:properties.healthState,running:properties.runningState,details:properties.runningStateDetails,error:properties.provisioningError,image:properties.template.containers[0].image,probes:properties.template.containers[0].probes}' -o json
          az containerapp replica list -g "$RG" -n "$APP" --revision "$LATEST_REVISION" -o table || true
          az containerapp logs show -g "$RG" -n "$APP" --type system --tail 100 || true
          az containerapp logs show -g "$RG" -n "$APP" --revision "$LATEST_REVISION" --type console --tail 120 || true

  deploy:
    name: Deploy infra + apps
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record deployment authorization
        env:
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          {
            echo "### Manual deployment authorization"
            echo "- Requested by: ${{ github.actor }}"
            echo "- Reason: $DEPLOY_REASON"
            echo "- Target: Azure DEV (nexora-rg-dev)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Azure OIDC secrets
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -z "${{ secrets.AZURE_TENANT_ID }}" ] || [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::Required Azure OIDC secrets are not configured"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push backend image to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER}/nexora-backend:${{ github.sha }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy infraestructura (Bicep)
        run: |
          az deployment sub create \
            --name nexora-deploy-${{ github.run_number }} \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters \
              postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}' \
              backendSecretKey='${{ secrets.BACKEND_SECRET_KEY }}' \
              bootstrapAdminPassword='${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}' \
              bootstrapAdminEmail='${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}' \
              editAccessTokenSalt='${{ secrets.EDIT_ACCESS_TOKEN_SALT }}' \
              editAccessTokenDigest='${{ secrets.EDIT_ACCESS_TOKEN_DIGEST }}' \
              backendImage='${{ env.IMAGE }}'

      - name: Capture deployed endpoints and performance settings
        run: |
          DEPLOYMENT_NAME="nexora-deploy-${{ github.run_number }}"
          FRONTEND_HOSTNAME="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.frontendHostname.value --output tsv)"
          BACKEND_FQDN="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.backendFqdn.value --output tsv)"
          EDIT_ACCESS_CONFIGURED="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.editAccessConfigured.value --output tsv)"
          DEPLOYED_IMAGE="$(az containerapp show --resource-group nexora-rg-dev --name nexora-backend-dev --query 'properties.template.containers[0].image' --output tsv)"
          MIN_REPLICAS="$(az containerapp show --resource-group nexora-rg-dev --name nexora-backend-dev --query 'properties.template.scale.minReplicas' --output tsv)"
          CPU="$(az containerapp show --resource-group nexora-rg-dev --name nexora-backend-dev --query 'properties.template.containers[0].resources.cpu' --output tsv)"
          MEMORY="$(az containerapp show --resource-group nexora-rg-dev --name nexora-backend-dev --query 'properties.template.containers[0].resources.memory' --output tsv)"

          if [ -z "$FRONTEND_HOSTNAME" ] || [ -z "$BACKEND_FQDN" ]; then
            echo "::error::Deployment did not return frontend/backend endpoints"
            exit 1
          fi
          if [[ "$DEPLOYED_IMAGE" != *"${{ github.sha }}"* ]]; then
            echo "::error::Container App desired template does not reference the expected Git SHA"
            exit 1
          fi
          if [ "$MIN_REPLICAS" != "1" ]; then
            echo "::error::Container App minReplicas is $MIN_REPLICAS, expected 1"
            exit 1
          fi
          if [ "$CPU" != "0.5" ] && [ "$CPU" != ".5" ]; then
            echo "::error::Container App CPU is $CPU, expected 0.5"
            exit 1
          fi

          echo "FRONTEND_URL=https://$FRONTEND_HOSTNAME" >> "$GITHUB_ENV"
          echo "BACKEND_URL=https://$BACKEND_FQDN" >> "$GITHUB_ENV"
          {
            echo "### Azure runtime"
            echo "- SHA: ${{ github.sha }}"
            echo "- Frontend: https://$FRONTEND_HOSTNAME"
            echo "- Backend: https://$BACKEND_FQDN"
            echo "- Container: $CPU CPU / $MEMORY / minReplicas=$MIN_REPLICAS"
            echo "- Protected Edit server secret configured: $EDIT_ACCESS_CONFIGURED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify latest backend revision is healthy and serving
        run: |
          set -euo pipefail
          APP=nexora-backend-dev
          RG=nexora-rg-dev
          EXPECTED_SHA='${{ github.sha }}'
          READY_REVISION=''

          for attempt in $(seq 1 36); do
            LATEST_REVISION="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)"
            READY_REVISION="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv)"
            LATEST_HEALTH="$(az containerapp revision list -g "$RG" -n "$APP" --query "[?name=='$LATEST_REVISION'] | [0].properties.healthState" -o tsv)"
            LATEST_IMAGE="$(az containerapp revision list -g "$RG" -n "$APP" --query "[?name=='$LATEST_REVISION'] | [0].properties.template.containers[0].image" -o tsv)"

            echo "attempt=$attempt latest=$LATEST_REVISION ready=$READY_REVISION health=$LATEST_HEALTH image=$LATEST_IMAGE"
            if [ -n "$LATEST_REVISION" ] \
              && [ "$LATEST_REVISION" = "$READY_REVISION" ] \
              && [ "$LATEST_HEALTH" = "Healthy" ] \
              && [[ "$LATEST_IMAGE" == *"$EXPECTED_SHA"* ]]; then
              echo "Backend revision $LATEST_REVISION is healthy and is the serving revision."
              {
                echo "- Ready backend revision: $LATEST_REVISION"
                echo "- Ready backend image: $LATEST_IMAGE"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Newest backend revision never became healthy/ready; refusing to validate an older serving revision"
          az containerapp revision list -g "$RG" -n "$APP" \
            --query '[].{name:name,active:properties.active,health:properties.healthState,image:properties.template.containers[0].image}' -o table || true
          if [ -n "${LATEST_REVISION:-}" ]; then
            az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST_REVISION" \
              --query '{health:properties.healthState,running:properties.runningState,details:properties.runningStateDetails,error:properties.provisioningError,image:properties.template.containers[0].image,probes:properties.template.containers[0].probes}' -o json || true
            az containerapp replica list -g "$RG" -n "$APP" --revision "$LATEST_REVISION" -o table || true
            az containerapp logs show -g "$RG" -n "$APP" --type system --tail 100 || true
            az containerapp logs show -g "$RG" -n "$APP" --revision "$LATEST_REVISION" --type console --tail 120 || true
          fi
          exit 1

      - name: Configure same-origin API route
        run: echo "VITE_API_BASE_URL=/api" >> "$GITHUB_ENV"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Get Static Web Apps deployment token
        id: swa-token
        run: |
          token="$(az staticwebapp secrets list \
            --name nexora-frontend-dev \
            --resource-group nexora-rg-dev \
            --query properties.apiKey \
            --output tsv)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Azure did not return a Static Web Apps deployment token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend a Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Verify production health, login and warm dashboard latency
        env:
          ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          COOKIE_JAR="$RUNNER_TEMP/nexora-production-cookies.txt"

          wait_for_status() {
            local url="$1"
            local expected="$2"
            local label="$3"
            local code=""
            for attempt in $(seq 1 24); do
              code="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = "$expected" ]; then
                return 0
              fi
              echo "$label not ready yet (HTTP $code, expected $expected), attempt $attempt/24"
              sleep 10
            done
            echo "::error::$label did not return HTTP $expected"
            return 1
          }

          wait_for_status "$FRONTEND_URL/" "200" "Frontend"
          wait_for_status "$BACKEND_URL/healthz" "401" "Backend direct ingress protection"
          wait_for_status "$FRONTEND_URL/api/healthz" "200" "Same-origin API health"
          wait_for_status "$FRONTEND_URL/api/readyz" "200" "Database readiness"
          wait_for_status "$FRONTEND_URL/api/edit-access/verify" "405" "Edit-access API route"

          HEALTH_TIME="$(curl --fail --silent --show-error --output /dev/null --write-out '%{time_total}' "$FRONTEND_URL/api/healthz")"
          READY_TIME="$(curl --fail --silent --show-error --output /dev/null --write-out '%{time_total}' "$FRONTEND_URL/api/readyz")"

          LOGIN_PAYLOAD="$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
          curl --fail --silent --show-error \
            --cookie-jar "$COOKIE_JAR" \
            --header 'Content-Type: application/json' \
            --data "$LOGIN_PAYLOAD" \
            "$FRONTEND_URL/api/auth/login" >/dev/null

          curl --fail --silent --show-error --cookie "$COOKIE_JAR" "$FRONTEND_URL/api/dashboard/summary" >/dev/null
          DASHBOARD_TIME="$(curl --fail --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --output "$RUNNER_TEMP/dashboard-summary.json" \
            --write-out '%{time_total}' \
            "$FRONTEND_URL/api/dashboard/summary")"

          jq -e '.currency == "HNL"' "$RUNNER_TEMP/dashboard-summary.json" >/dev/null

          if ! awk -v value="$READY_TIME" 'BEGIN { exit !(value < 3.0) }'; then
            echo "::error::Warm readyz latency ${READY_TIME}s exceeds 3.0s budget"
            exit 1
          fi
          if ! awk -v value="$DASHBOARD_TIME" 'BEGIN { exit !(value < 3.0) }'; then
            echo "::error::Warm dashboard latency ${DASHBOARD_TIME}s exceeds 3.0s budget"
            exit 1
          fi

          {
            echo "### Production smoke and latency"
            echo "- healthz: ${HEALTH_TIME}s"
            echo "- readyz: ${READY_TIME}s"
            echo "- authenticated dashboard warm: ${DASHBOARD_TIME}s"
            echo "- edit-access route: verified"
            echo "- HNL contract: verified"
          } >> "$GITHUB_STEP_SUMMARY"
