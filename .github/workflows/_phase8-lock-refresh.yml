name: Phase 8 Lock Refresh

on:
  push:
    branches:
      - fix/phase8-accounting-posting-integrity-20261006

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh lockfile without installing scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "fix(phase8): refresh frontend lockfile"
          git push origin HEAD:fix/phase8-accounting-posting-integrity-20261006
