name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
      BOOTSTRAP_ADMIN_EMAIL: admin@nexora.group
      BOOTSTRAP_ADMIN_PASSWORD: NexoraAdmin123!
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Compile Python source
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Check undefined names and syntax errors
        working-directory: backend
        run: ruff check --select E9,F63,F7,F82 app tests
      - name: Audit backend dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt
      - name: Create test database for worktree slug
        run: |
          SLUG=$(python3 -c "import re,os; print(re.sub(r'[^a-z0-9]+','_',os.path.basename(os.path.dirname(os.path.join('${{ github.workspace }}','backend'))).lower()).strip('_') or 'default')")
          PGPASSWORD=nexora createdb -h localhost -U nexora -O nexora "nexora_test_${SLUG}" || true
      - name: Run alembic migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  iac:
    name: Compile Azure Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile subscription template without deploying
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        env:
          AZURITE_ACCOUNTS: nexorae2e:bmV4b3JhLWUyZS1henVyaXRlLXNoYXJlZC1rZXktMDAwMQ==
        ports:
          - 10000:10000
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: nexora
      PGPASSWORD: nexora
      E2E_AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=nexorae2e;AccountKey=bmV4b3JhLWUyZS1henVyaXRlLXNoYXJlZC1rZXktMDAwMQ==;BlobEndpoint=http://127.0.0.1:10000/nexorae2e;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies in E2E virtualenv
        working-directory: backend
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run critical journeys and accessibility E2E
        working-directory: frontend
        run: npm run test:e2e
