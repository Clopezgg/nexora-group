<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0b0b0a">
<title>Cándida & Alberto · 03.10.2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap');
:root{--bg:#0b0b0a;--ink:#ebe3d1;--muted:#b9ae9c;--gold:#c7ab75;--line:rgba(199,171,117,.34)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,sans-serif}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:flex;justify-content:center;background:radial-gradient(circle at 50% 20%,#201b17,#0b0b0a 48%,#070706)}.shell{width:min(100%,520px);min-height:100vh}.screen{min-height:100vh;padding:50px 28px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;animation:in .6s ease}.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}.serif{font-family:"Cormorant Garamond",serif}.title{font-size:clamp(52px,15vw,82px);font-weight:500;line-height:.8;letter-spacing:-.04em;margin:18px 0}.subtitle{font-size:14px;color:var(--muted);letter-spacing:.06em}.date{font-size:18px;letter-spacing:.16em;color:var(--gold);margin:22px 0 5px}.tiny{font-size:11px;color:#928978;letter-spacing:.08em}.rule{width:90px;height:1px;background:var(--gold);margin:18px auto}.envelope-wrap{height:390px;display:flex;align-items:center}.envelope{width:min(286px,82vw);height:192px;background:#1f1c1a;border-radius:14px;position:relative;box-shadow:0 30px 70px #0008;cursor:pointer;transition:.45s}.envelope:before{content:"";position:absolute;left:0;right:0;top:0;border-left:143px solid transparent;border-right:143px solid transparent;border-top:112px solid #2a2623;transform-origin:top;transition:.8s}.envelope.open{transform:translateY(8px)}.envelope.open:before{transform:rotateX(175deg)}.seal{position:absolute;z-index:2;left:50%;top:71px;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ecd39d,#9e7e49);color:#0b0b0a;font-size:10px}.open{font-size:12px;letter-spacing:.18em}.open:after{content:"";display:block;width:90px;height:1px;background:var(--gold);margin:10px auto}.age{font-size:clamp(110px,30vw,170px);line-height:.7;color:var(--gold);margin:15px 0 4px}.honoree{font-size:clamp(55px,16vw,86px);line-height:.8;margin:0}.quote{max-width:340px;font:22px/1.15 "Cormorant Garamond";color:#d8cfbf;margin:22px 0}.card{width:100%;border:1px solid var(--line);background:#151311bb;padding:18px;border-radius:16px;text-align:left;margin:6px 0}.label{font-size:10px;letter-spacing:.18em;color:var(--gold)}.value{margin-top:7px;font-size:15px;line-height:1.4}.stack{width:100%;display:grid;gap:10px;margin-top:16px}.cta{width:100%;border:1px solid var(--gold);background:var(--gold);color:#0b0b0a;padding:14px 18px;border-radius:999px;letter-spacing:.14em;font-size:11px;cursor:pointer;text-transform:uppercase}.secondary{background:transparent;color:var(--ink)}a{text-decoration:none}.form{width:100%;display:grid;gap:12px;text-align:left}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--gold);letter-spacing:.1em}.field input,.field textarea,.field select{width:100%;background:#11100f;border:1px solid #40392f;color:var(--ink);padding:13px;border-radius:12px;outline:0}.field textarea{min-height:90px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice button{padding:12px;border-radius:12px;border:1px solid #40392f;background:#11100f;color:var(--muted)}.choice .active{border-color:var(--gold);color:var(--gold)}.back{align-self:flex-start;color:var(--gold);background:none;border:0;font-size:11px;letter-spacing:.08em}.admin{justify-content:flex-start;align-items:stretch;text-align:left;padding:28px 18px}.admin h1{font:500 42px "Cormorant Garamond";margin:8px 0 20px}.table-wrap{overflow:auto;border:1px solid #312c26;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:9px;border-bottom:1px solid #29241f;font-size:11px}.table th{color:var(--gold);text-align:left}.ok{color:#d8c58e}.no{color:#a99583}@keyframes in{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
</style></head>
<body><main class="app"><div id="app" class="shell"></div></main>
<script>
const CONFIG={url:"__SUPABASE_URL__",key:"__SUPABASE_PUBLISHABLE_KEY__"},MAP="https://www.google.com/maps/search/?api=1&query=8261+SW+8th+St+North+Lauderdale+FL+33068";
let db,inv,token,attending=true;const root=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function configured(){return CONFIG.url.startsWith("http")&&CONFIG.key.startsWith("sb_")}
function route(){const p=location.pathname.split("/").filter(Boolean),i=p.indexOf("i");return{token:i>=0?p[i+1]||"":new URLSearchParams(location.search).get("token")||"",admin:p.includes("admin")}}
function screen(h,c=""){root.innerHTML='<section class="screen '+c+'">'+h+"</section>"}
function cover(){screen('<div class="eyebrow">Una invitación para ti</div><div class="envelope-wrap"><div class="envelope" id="env"><div class="seal">C · A</div></div></div><div class="open">ABRIR INVITACIÓN</div><div class="tiny">UNA FECHA · DOS HISTORIAS</div>');env.onclick=()=>{env.classList.add("open");setTimeout(reveal,650)}}
function reveal(){let al=inv.honoree==="alberto";screen('<div class="eyebrow">Tu persona a celebrar</div><div class="age serif">'+(al?38:66)+'</div><h1 class="honoree serif">'+(al?"ALBERTO":"CÁNDIDA")+'</h1><div class="quote">'+(al?"Una vida para celebrar, una noche para recordar.":"Una vida de historias, cariño y motivos para celebrar.")+'</div><div class="date">03 · OCT · 2026</div><div class="tiny">SÁBADO · 8:00 PM</div><div class="rule"></div><button class="cta" id="next">CONTINUAR</button>');next.onclick=details}
function details(){screen('<div class="eyebrow">Cándida & Alberto</div><h1 class="title serif">Una noche<br>para celebrar</h1><div class="card"><div class="label">FECHA</div><div class="value">Sábado, 3 de octubre de 2026 · 8:00 PM</div></div><div class="card"><div class="label">LUGAR</div><div class="value">8261 SW 8th St<br>North Lauderdale, FL 33068</div></div><div class="card"><div class="label">TU PERSONA A CELEBRAR</div><div class="value">'+(inv.honoree==="alberto"?"Alberto · 38 años":"Cándida · 66 años")+"</div></div><div class="stack"><button class="cta" id="rsvp">CONFIRMAR ASISTENCIA</button><a class="cta secondary" href=""+MAP+"" target="_blank" rel="noopener">ABRIR EN GOOGLE MAPS</a></div>");rsvp.onclick=form}
function form(){let n=inv.seat_limit||1;screen('<button class="back" id="back">← VOLVER</button><div class="eyebrow" style="margin-top:30px">RSVP</div><h1 class="title serif" style="font-size:58px">¿Nos acompañas?</h1><p class="subtitle">Hemos reservado '+n+" lugar"+(n>1?"es":"")+" para ti.</p><form class="form" id="f"><div class="field"><label>NOMBRE</label><input id="name" required maxlength="120" value=""+esc(inv.guest_name)+"" placeholder="Tu nombre"></div><div class="field"><label>ASISTENCIA</label><div class="choice"><button type="button" id="y" class=""+(attending?"active":"")+"">SÍ, ASISTIRÉ</button><button type="button" id="no" class=""+(!attending?"active":"")+"">NO PODRÉ</button></div></div><div class="field"><label>PERSONAS</label><select id="party">'+Array.from({length:n},(_,i)=>'<option>'+(i+1)+'</option>').join("")+'</select></div><div class="field"><label>MENSAJE · OPCIONAL</label><textarea id="message" maxlength="500">'+esc(inv.message||"")+"</textarea></div><button class="cta">GUARDAR CONFIRMACIÓN</button><div id="msg" class="tiny"></div></form>");back.onclick=details;y.onclick=()=>{attending=true;form()};no.onclick=()=>{attending=false;form()};party.value=String(Math.min(inv.party_size||1,n));f.onsubmit=save}
async function save(e){e.preventDefault();msg.textContent="Guardando…";let{data,error}=await db.rpc("save_rsvp",{p_token:token,p_guest_name:name.value,p_attending:attending,p_party_size:Number(party.value),p_message:message.value});if(error){msg.textContent="No pudimos guardar la confirmación.";return}inv={...inv,...data[0]};screen('<div class="eyebrow">Confirmación recibida</div><div class="age serif">✓</div><h1 class="honoree serif" style="font-size:48px">Gracias, '+esc(inv.guest_name)+'.</h1><div class="quote">'+(attending?"Nos encantará compartir esta noche contigo.":"Gracias por avisarnos; te tendremos presente.")+'</div><div class="stack"><button class="cta" id="d">VER DETALLES</button><button class="cta secondary" id="e">EDITAR RSVP</button></div>');d.onclick=details;e.onclick=form}
async function invite(){if(!configured()){screen('<div class="eyebrow">Configuración pendiente</div><h1 class="title serif">La invitación está lista</h1><p class="subtitle">Conecta Supabase para activar los tokens y RSVP.</p>');return}db=supabase.createClient(CONFIG.url,CONFIG.key);if(!token){screen('<div class="eyebrow">Invitación privada</div><h1 class="title serif" style="font-size:54px">Enlace incompleto</h1>');return}let{data,error}=await db.rpc("resolve_invitation",{p_token:token});if(error||!data?.[0]){screen('<div class="eyebrow">Invitación</div><h1 class="title serif" style="font-size:54px">Enlace no válido</h1><p class="subtitle">Este enlace no está activo.</p>');return}inv=data[0];cover()}
async function admin(){if(!configured()){screen("<h1>Supabase pendiente</h1>");return}db=db||supabase.createClient(CONFIG.url,CONFIG.key);let{data:{session}}=await db.auth.getSession();if(!session){screen('<div class="eyebrow">Área privada</div><h1 class="title serif" style="font-size:54px">Administración</h1><form class="form" id="login"><div class="field"><label>EMAIL</label><input id="email" type="email" required></div><div class="field"><label>CONTRASEÑA</label><input id="password" type="password" required></div><button class="cta">ENTRAR</button></form>');login.onsubmit=async e=>{e.preventDefault();let{error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)alert("Credenciales no válidas");else admin()};return}let{data,error}=await db.rpc("admin_overview",{p_email:session.user.email});if(error){screen('<div class="eyebrow">Área privada</div><h1 class="title serif">Acceso no autorizado</h1>');return}let rows=data||[];screen('<div class="eyebrow">ADMIN · CÁNDIDA & ALBERTO</div><h1>Panel de invitaciones</h1><div class="card"><div class="label">ASIGNACIÓN</div><div class="value">Cándida '+rows.filter(x=>x.honoree==="candida").length+" · Alberto "+rows.filter(x=>x.honoree==="alberto").length+'</div></div><div class="card"><div class="label">CONFIRMADOS</div><div class="value">'+rows.filter(x=>x.attending).length+'</div></div><input id="filter" placeholder="Buscar token o invitado" style="width:100%;padding:12px;background:#11100f;border:1px solid #40392f;color:#ebe3d1;border-radius:10px;margin:10px 0"><div class="table-wrap"><table class="table"><thead><tr><th>Token</th><th>Persona</th><th>Invitado</th><th>Asiste</th><th>Personas</th></tr></thead><tbody id="tbody"></tbody></table></div>','admin');function paint(){let q=filter.value.toLowerCase();tbody.innerHTML=rows.filter(r=>(r.token+" "+(r.guest_name||"")).toLowerCase().includes(q)).map(r=>"<tr><td>"+esc(r.token)+"</td><td>"+esc(r.honoree)+"</td><td>"+esc(r.guest_name||"—")+"</td><td class='"+(r.attending?"ok":"no")+"'>"+(r.attending?"Sí":"—")+"</td><td>"+(r.party_size||"—")+"</td></tr>").join("")}paint();filter.oninput=paint}
let r=route();token=r.token;r.admin?admin():invite();
</script></body></html>
