name: _Persist Frontend Lockfile

on:
  push:
    branches: [fix/phases9-15-certified-20261006]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  persist:
    if: github.event.head_commit.message != 'ci: persist npm-generated lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate and validate
        working-directory: frontend
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          npm install --package-lock-only
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Commit generated lockfile and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/_persist_frontend_lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: persist npm-generated lockfile"
          git push
