name: Free AI PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: free-ai-pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.sender.type != 'Bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: PR-Agent review
        uses: The-PR-Agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GROQ.KEY: ${{ secrets.GROQ_KEY }}

          config.model: "groq/openai/gpt-oss-120b"
          config.fallback_models: '["groq/qwen/qwen3.8-27b"]'

          # Mantener cada llamada dentro de una escala razonable para
          # el Free Tier y obligar a PR-Agent a comprimir PRs grandes.
          config.max_model_tokens: "6500"

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"

          pr_reviewer.extra_instructions: >-
            Actúa como revisor senior de software empresarial.
            Prioriza bugs funcionales reales, autorización y RBAC,
            integridad de datos, concurrencia, transacciones, migraciones,
            fallos fail-open, manejo de errores, regresiones, seguridad,
            contratos API, efectos cross-file y riesgos de despliegue.
            Evita comentarios cosméticos, repetitivos o especulativos.
            Reporta primero los hallazgos de mayor impacto y explica
            cómo reproducir o verificar cada problema.

          pr_code_suggestions.extra_instructions: >-
            Propón cambios concretos solamente cuando exista evidencia
            suficiente de que el cambio corrige un problema real.
