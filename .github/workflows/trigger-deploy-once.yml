name: Trigger Deploy Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-deploy-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch authorized Azure DEV deploy
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Azure with explicit authorization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/actions/workflows/deploy-azure.yml/dispatches" \
            -f ref=main \
            -f 'inputs[deploy]=true' \
            -f 'inputs[reason]=Publish merged PR #19: complete NEXORA visual overhaul, protected edits, and authorized project reset'
