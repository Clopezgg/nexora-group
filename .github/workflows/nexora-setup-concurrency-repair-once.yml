name: Temporary Project Setup concurrency repair
on:
  push:
    branches:
      - audit/visual-shell-root-cause-v2-20260918
    paths:
      - .github/workflows/nexora-setup-concurrency-repair-once.yml
permissions:
  contents: write
jobs:
  scoped-repair:
    if: github.repository == 'Clopezgg/nexora-group' && github.ref == 'refs/heads/audit/visual-shell-root-cause-v2-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Lock setup status before auditing and add PostgreSQL race test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def change(path, old, new):
              file=Path(path)
              content=file.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one source anchor, found {content.count(old)}')
              file.write_text(content.replace(old,new,1))
          path='backend/app/api/routes/projects.py'
          change(path,
                 'from fastapi import APIRouter, Depends, Header, HTTPException, Query, status\nfrom sqlalchemy.exc import IntegrityError',
                 'from fastapi import APIRouter, Depends, Header, HTTPException, Query, status\nfrom sqlalchemy import select\nfrom sqlalchemy.exc import IntegrityError')
          change(path,
                 '    if run.requested_by != user.id:\n        raise HTTPException(status_code=403, detail="Solo quien inició esta configuración puede reanudarla")\n    if run.status == "COMPLETED":',
                 '    if run.requested_by != user.id:\n        raise HTTPException(status_code=403, detail="Solo quien inició esta configuración puede reanudarla")\n    # The route and the service must make the COMPLETED/idempotency decision\n    # from the same locked row. An unlocked DRAFT read can be stale while an\n    # overlapping executor commits and would otherwise double-write AuditLog.\n    run = db.execute(\n        select(ProjectSetupRun)\n        .where(ProjectSetupRun.id == run_id)\n        .with_for_update()\n        .execution_options(populate_existing=True)\n    ).scalar_one_or_none()\n    if run is None:\n        raise HTTPException(status_code=404, detail="Configuración de proyecto no encontrada")\n    if run.status == "COMPLETED":')
          path='backend/tests/test_project_setup_workflow.py'
          content=Path(path).read_text()
          if 'test_concurrent_setup_execution_writes_only_one_completion_audit' in content:
              raise SystemExit('Concurrent setup regression already present')
          content += '''\n\ndef test_concurrent_setup_execution_writes_only_one_completion_audit(client, db_session, monkeypatch):\n    """Two stale DRAFT reads must serialize before completion and its audit."""\n    from concurrent.futures import ThreadPoolExecutor\n    from threading import Barrier\n\n    from sqlalchemy.orm import Session\n\n    from app.api.routes import projects\n    from app.models.user import User\n    from app.services import project_setup_service\n    from tests.conftest import BOOTSTRAP_ADMIN_EMAIL\n\n    login_admin(client)\n    company = create_company(client)\n    created = client.post(\n        "/api/projects/setup-runs",\n        json=_payload(company["id"]),\n        headers={"Idempotency-Key": "project-setup-race"},\n    )\n    assert created.status_code == 201, created.text\n    run_id = uuid.UUID(created.json()["id"])\n    engine = db_session.get_bind()\n    barrier = Barrier(2)\n    original_get = project_setup_service.get_run\n\n    def synchronized_unlocked_read(db, identifier):\n        row = original_get(db, identifier)\n        if row is not None and row.status == "DRAFT":\n            barrier.wait(timeout=15)\n        return row\n\n    monkeypatch.setattr(project_setup_service, "get_run", synchronized_unlocked_read)\n\n    def invoke(_):\n        with Session(engine) as session:\n            user = session.scalar(select(User).where(User.email == BOOTSTRAP_ADMIN_EMAIL))\n            return projects.execute_setup_run(\n                run_id, db=session, user=user, correlation_id="setup-concurrent",\n            )\n\n    with ThreadPoolExecutor(max_workers=2) as pool:\n        results = list(pool.map(invoke, range(2)))\n    assert [r.status for r in results] == ["COMPLETED", "COMPLETED"]\n    assert results[0].project_id == results[1].project_id\n    db_session.expire_all()\n    projects_created = db_session.scalars(\n        select(Project).where(Project.company_id == uuid.UUID(company["id"]))\n    ).all()\n    assert len(projects_created) == 1\n    completion_audits = db_session.scalars(\n        select(AuditLog).where(\n            AuditLog.entity_id == run_id,\n            AuditLog.action == "project.setup.complete",\n        )\n    ).all()\n    assert len(completion_audits) == 1\n'''
          Path(path).write_text(content)
          Path('.github/workflows/nexora-setup-concurrency-repair-once.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/api/routes/projects.py backend/tests/test_project_setup_workflow.py .github/workflows/nexora-setup-concurrency-repair-once.yml
          git diff --cached --check
          git commit -m 'fix(project): lock setup run before deciding completion audit'
          git push origin HEAD:refs/heads/audit/visual-shell-root-cause-v2-20260918
