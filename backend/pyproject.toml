[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# FastAPI intentionally declares dependency providers in function defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/core/database.py" = ["F403"]
"tests/conftest.py" = ["E402"]
"tests/**" = ["E741", "F841"]
