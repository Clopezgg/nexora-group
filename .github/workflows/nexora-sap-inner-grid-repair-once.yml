name: Temporary SAP nested grid repair
on:
  push:
    branches:
      - audit/visual-shell-root-cause-v2-20260918
    paths:
      - .github/workflows/nexora-sap-inner-grid-repair-once.yml
permissions:
  contents: write
jobs:
  scoped-repair:
    if: github.repository == 'Clopezgg/nexora-group' && github.ref == 'refs/heads/audit/visual-shell-root-cause-v2-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Align nested SAP sidebar/main grid and measure geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def change(path, old, new):
              file=Path(path)
              content=file.read_text()
              if content.count(old)!=1:
                  raise SystemExit(f'{path}: expected one anchor, got {content.count(old)}')
              file.write_text(content.replace(old,new,1))
          change('frontend/src/sap-gui/components/SapWorkstation.css',
                 '.nx-sap-workstation .nx-sap-sidebar {\n  grid-column: 1;\n  grid-row: 4;',
                 '/* The sidebar is nested inside .nx-sap-workarea (outer grid row 4).\n   Its own inner grid row is 1, shared with the main content; row 4 here\n   implicitly created three empty tracks and vertically separated them. */\n.nx-sap-workstation .nx-sap-sidebar {\n  grid-column: 1;\n  grid-row: 1;')
          change('frontend/e2e/sap-gui-visual.spec.ts',
                 "    if (viewport.width <= 768) {\n      const chrome = await page.evaluate(() => {",
                 "    if (viewport.width > 1024) {\n      const columns = await page.evaluate(() => {\n        const sidebar = document.querySelector('.nx-sap-workarea > .nx-sap-sidebar')?.getBoundingClientRect()\n        const main = document.querySelector('.nx-sap-workarea > .nx-sap-main')?.getBoundingClientRect()\n        return { sidebarTop: sidebar?.top ?? -1, mainTop: main?.top ?? -1,\n          sidebarRight: sidebar?.right ?? -1, mainLeft: main?.left ?? -1 }\n      })\n      expect(columns.sidebarTop, 'SAP sidebar y main deben compartir fila del grid interno').toBeGreaterThanOrEqual(columns.mainTop - 1)\n      expect(columns.sidebarTop, 'SAP sidebar y main deben compartir fila del grid interno').toBeLessThanOrEqual(columns.mainTop + 1)\n      expect(columns.sidebarRight, 'SAP sidebar no debe desplazar el main').toBeLessThanOrEqual(columns.mainLeft + 1)\n    }\n    if (viewport.width <= 768) {\n      const chrome = await page.evaluate(() => {")
          Path('.github/workflows/nexora-sap-inner-grid-repair-once.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/sap-gui/components/SapWorkstation.css frontend/e2e/sap-gui-visual.spec.ts .github/workflows/nexora-sap-inner-grid-repair-once.yml
          git diff --cached --check
          git commit -m 'fix(ui): align SAP inner grid sidebar and main row with geometric regression'
          git push origin HEAD:refs/heads/audit/visual-shell-root-cause-v2-20260918
