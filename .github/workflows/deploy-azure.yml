name: Deploy Azure

on:
  pull_request:
    paths:
      - "infra/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-azure.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Confirmo que este run puede desplegar recursos Azure DEV"
        required: true
        type: boolean
        default: false
      reason:
        description: "Motivo o cambio que autoriza este despliegue"
        required: true
        type: string
        default: "Despliegue manual autorizado"

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: nexora-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Bicep what-if
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      BACKEND_SECRET_KEY: ${{ secrets.BACKEND_SECRET_KEY }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      EDIT_ACCESS_TOKEN_SALT: ${{ secrets.EDIT_ACCESS_TOKEN_SALT }}
      EDIT_ACCESS_TOKEN_DIGEST: ${{ secrets.EDIT_ACCESS_TOKEN_DIGEST }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required deployment secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID POSTGRES_ADMIN_PASSWORD BACKEND_SECRET_KEY BOOTSTRAP_ADMIN_PASSWORD BOOTSTRAP_ADMIN_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret $name is not configured"
              exit 1
            fi
          done
          if { [ -n "$EDIT_ACCESS_TOKEN_SALT" ] && [ -z "$EDIT_ACCESS_TOKEN_DIGEST" ]; } || { [ -z "$EDIT_ACCESS_TOKEN_SALT" ] && [ -n "$EDIT_ACCESS_TOKEN_DIGEST" ]; }; then
            echo "::error::EDIT_ACCESS_TOKEN_SALT and EDIT_ACCESS_TOKEN_DIGEST must be configured together"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare validation Protected Edit credentials
        run: |
          set -euo pipefail
          if [ -n "$EDIT_ACCESS_TOKEN_SALT" ] && [ -n "$EDIT_ACCESS_TOKEN_DIGEST" ]; then
            exit 0
          fi
          IFS=$'\t' read -r DERIVED_SALT DERIVED_DIGEST < <(
            python -c 'import base64,hashlib,os,secrets; pin=os.environ["BOOTSTRAP_ADMIN_PASSWORD"]; salt=secrets.token_bytes(16); digest=hashlib.pbkdf2_hmac("sha256", pin.encode(), salt, 250000); print(base64.urlsafe_b64encode(salt).decode()+"\t"+base64.urlsafe_b64encode(digest).decode())'
          )
          echo "::add-mask::$DERIVED_SALT"
          echo "::add-mask::$DERIVED_DIGEST"
          echo "EDIT_ACCESS_TOKEN_SALT=$DERIVED_SALT" >> "$GITHUB_ENV"
          echo "EDIT_ACCESS_TOKEN_DIGEST=$DERIVED_DIGEST" >> "$GITHUB_ENV"

      - name: What-if (no crea recursos)
        run: |
          set -euo pipefail
          az deployment sub what-if \
            --name nexora-ci-whatif \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              backendSecretKey="$BACKEND_SECRET_KEY" \
              bootstrapAdminPassword="$BOOTSTRAP_ADMIN_PASSWORD" \
              bootstrapAdminEmail="$BOOTSTRAP_ADMIN_EMAIL" \
              editAccessTokenSalt="$EDIT_ACCESS_TOKEN_SALT" \
              editAccessTokenDigest="$EDIT_ACCESS_TOKEN_DIGEST"

  deploy:
    name: Deploy infra + apps
    needs: validate
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      BACKEND_SECRET_KEY: ${{ secrets.BACKEND_SECRET_KEY }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      EDIT_ACCESS_TOKEN_SALT: ${{ secrets.EDIT_ACCESS_TOKEN_SALT }}
      EDIT_ACCESS_TOKEN_DIGEST: ${{ secrets.EDIT_ACCESS_TOKEN_DIGEST }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Record deployment authorization
        env:
          DEPLOY_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || github.event.head_commit.message }}
        run: |
          {
            echo "### Deployment authorization"
            echo "- Requested by: ${{ github.actor }}"
            echo "- Reason: $DEPLOY_REASON"
            echo "- Target: Azure DEV (nexora-rg-dev)"
            echo "- SHA: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Prepare Protected Edit credentials
        run: |
          set -euo pipefail
          if [ -n "$EDIT_ACCESS_TOKEN_SALT" ] && [ -n "$EDIT_ACCESS_TOKEN_DIGEST" ]; then
            echo "EDIT_ACCESS_FALLBACK=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$EDIT_ACCESS_TOKEN_SALT" ] || [ -n "$EDIT_ACCESS_TOKEN_DIGEST" ]; then
            echo "::error::EDIT_ACCESS_TOKEN_SALT and EDIT_ACCESS_TOKEN_DIGEST must be configured together"
            exit 1
          fi
          IFS=$'\t' read -r DERIVED_SALT DERIVED_DIGEST < <(
            python -c 'import base64,hashlib,os,secrets; pin=os.environ["BOOTSTRAP_ADMIN_PASSWORD"]; salt=secrets.token_bytes(16); digest=hashlib.pbkdf2_hmac("sha256", pin.encode(), salt, 250000); print(base64.urlsafe_b64encode(salt).decode()+"\t"+base64.urlsafe_b64encode(digest).decode())'
          )
          echo "::add-mask::$DERIVED_SALT"
          echo "::add-mask::$DERIVED_DIGEST"
          echo "EDIT_ACCESS_TOKEN_SALT=$DERIVED_SALT" >> "$GITHUB_ENV"
          echo "EDIT_ACCESS_TOKEN_DIGEST=$DERIVED_DIGEST" >> "$GITHUB_ENV"
          echo "EDIT_ACCESS_FALLBACK=true" >> "$GITHUB_ENV"

      - name: Build and push backend image to GHCR
        run: |
          set -euo pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/nexora-backend:${{ github.sha }}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run database migrations
        run: |
          set -euo pipefail
          RG=nexora-rg-dev
          POSTGRES_FQDN="$(az postgres flexible-server list -g "$RG" --query '[0].fullyQualifiedDomainName' -o tsv)"
          if [ -z "$POSTGRES_FQDN" ] || [ "$POSTGRES_FQDN" = "null" ]; then
            echo "::error::PostgreSQL FQDN could not be resolved"
            exit 1
          fi
          ENCODED_PASSWORD="$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_ADMIN_PASSWORD"], safe=""))')"
          DATABASE_URL="postgresql+psycopg://nexoraadmin:${ENCODED_PASSWORD}@${POSTGRES_FQDN}:5432/nexora?sslmode=require"
          echo "::add-mask::$DATABASE_URL"
          docker run --rm \
            --env DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" \
            sh -ec 'python -u -m app.pre_migration_repairs && alembic upgrade head'

      - name: Deploy infrastructure and backend
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "nexora-deploy-${{ github.run_number }}" \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              backendSecretKey="$BACKEND_SECRET_KEY" \
              bootstrapAdminPassword="$BOOTSTRAP_ADMIN_PASSWORD" \
              bootstrapAdminEmail="$BOOTSTRAP_ADMIN_EMAIL" \
              editAccessTokenSalt="$EDIT_ACCESS_TOKEN_SALT" \
              editAccessTokenDigest="$EDIT_ACCESS_TOKEN_DIGEST" \
              backendImage="$IMAGE"

      - name: Start backend when a prior migration rollout left it stopped
        run: |
          set -euo pipefail
          APP=nexora-backend-dev
          RG=nexora-rg-dev
          API_VERSION=2025-07-01
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          APP_RESOURCE_URL="https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.App/containerApps/${APP}"

          running_status="$(az rest --method get --url "${APP_RESOURCE_URL}?api-version=${API_VERSION}" --query properties.runningStatus -o tsv)"
          echo "Container App running status after deployment: $running_status"
          if [ "$running_status" = "Stopped" ]; then
            az rest --method post --url "${APP_RESOURCE_URL}/start?api-version=${API_VERSION}" >/dev/null
          elif [ "$running_status" != "Running" ]; then
            echo "::error::Container App is in unexpected running status: $running_status"
            exit 1
          fi

          for attempt in $(seq 1 36); do
            running_status="$(az rest --method get --url "${APP_RESOURCE_URL}?api-version=${API_VERSION}" --query properties.runningStatus -o tsv)"
            echo "attempt=$attempt runningStatus=$running_status"
            if [ "$running_status" = "Running" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Container App did not reach Running after deployment"
          exit 1

      - name: Capture deployed endpoints
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="nexora-deploy-${{ github.run_number }}"
          FRONTEND_HOSTNAME="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.frontendHostname.value -o tsv)"
          BACKEND_FQDN="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.backendFqdn.value -o tsv)"
          BACKEND_RESOURCE_ID="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.backendResourceId.value -o tsv)"
          EDIT_ACCESS_CONFIGURED="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.editAccessConfigured.value -o tsv)"
          DEPLOYED_IMAGE="$(az containerapp show -g nexora-rg-dev -n nexora-backend-dev --query 'properties.template.containers[0].image' -o tsv)"
          MIN_REPLICAS="$(az containerapp show -g nexora-rg-dev -n nexora-backend-dev --query 'properties.template.scale.minReplicas' -o tsv)"
          [ -n "$FRONTEND_HOSTNAME" ] && [ -n "$BACKEND_FQDN" ] && [ -n "$BACKEND_RESOURCE_ID" ]
          [[ "$DEPLOYED_IMAGE" == *"${{ github.sha }}"* ]]
          [ "$MIN_REPLICAS" = "1" ]
          [ "${EDIT_ACCESS_CONFIGURED,,}" = "true" ]
          echo "FRONTEND_URL=https://$FRONTEND_HOSTNAME" >> "$GITHUB_ENV"
          echo "BACKEND_URL=https://$BACKEND_FQDN" >> "$GITHUB_ENV"
          echo "BACKEND_RESOURCE_ID=$BACKEND_RESOURCE_ID" >> "$GITHUB_ENV"

      - name: Link Static Web Apps backend for first-party /api
        run: |
          set -euo pipefail
          # The frontend (Static Web Apps) and the API (Container Apps) live on
          # different registrable domains. A cross-site session cookie
          # (SameSite=None) is silently dropped by Safari/WebKit ITP, so the
          # browser looks logged in but every authenticated call fails.
          # Linking the Container App as the Static Web Apps backend makes the
          # SPA call `/api/*` on its OWN origin; Static Web Apps proxies to the
          # Container App and rewrites Set-Cookie to the first-party domain.
          SWA=nexora-frontend-dev
          RG=nexora-rg-dev
          REGION=eastus2
          az staticwebapp backends unlink --name "$SWA" --resource-group "$RG" --only-show-errors >/dev/null 2>&1 || true
          LINK_JSON="$(az staticwebapp backends link \
            --name "$SWA" \
            --resource-group "$RG" \
            --backend-resource-id "$BACKEND_RESOURCE_ID" \
            --backend-region "$REGION" \
            --only-show-errors -o json)"
          echo "$LINK_JSON" | jq '{name, backendResourceId, provisioningState}'
          STATE="$(echo "$LINK_JSON" | jq -r '.provisioningState')"
          LINKED_ID="$(echo "$LINK_JSON" | jq -r '.backendResourceId')"
          if [ "$STATE" != "Succeeded" ] || [ "$LINKED_ID" != "$BACKEND_RESOURCE_ID" ]; then
            echo "::error::Static Web Apps linked backend did not attach (state=$STATE id=${LINKED_ID:-<none>})"
            exit 1
          fi
          # Confirm it is listed on the build (the list command returns an array).
          az staticwebapp backends show --name "$SWA" --resource-group "$RG" -o json \
            | jq -e --arg id "$BACKEND_RESOURCE_ID" 'if type=="array" then any(.[]; .backendResourceId==$id) else (.backendResourceId==$id) end' \
            >/dev/null \
            || { echo "::error::Linked backend not present in 'backends show'"; exit 1; }
          echo "Static Web Apps linked backend attached: $LINKED_ID"

      - name: Verify newest backend revision is healthy
        run: |
          set -euo pipefail
          APP=nexora-backend-dev
          RG=nexora-rg-dev
          EXPECTED_SHA="${{ github.sha }}"
          for attempt in $(seq 1 36); do
            LATEST_REVISION="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)"
            READY_REVISION="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv)"
            RUNNING_STATUS="$(az containerapp show -g "$RG" -n "$APP" --query properties.runningStatus -o tsv)"
            HEALTH="$(az containerapp revision list -g "$RG" -n "$APP" --query "[?name=='$LATEST_REVISION'] | [0].properties.healthState" -o tsv)"
            REV_IMAGE="$(az containerapp revision list -g "$RG" -n "$APP" --query "[?name=='$LATEST_REVISION'] | [0].properties.template.containers[0].image" -o tsv)"
            echo "attempt=$attempt running=$RUNNING_STATUS latest=$LATEST_REVISION ready=$READY_REVISION health=$HEALTH"
            if [ "$RUNNING_STATUS" = "Running" ] && [ -n "$LATEST_REVISION" ] && [ "$LATEST_REVISION" = "$READY_REVISION" ] && [ "$HEALTH" = "Healthy" ] && [[ "$REV_IMAGE" == *"$EXPECTED_SHA"* ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Newest backend revision never became healthy/ready"
          exit 1

      - name: Verify direct Container Apps API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$BACKEND_URL/api/healthz" || true)"
            if [ "$code" = "200" ]; then
              echo "Direct Container Apps API: HTTP 200"
              exit 0
            fi
            echo "Direct Container Apps API not ready (HTTP $code), attempt $attempt/30"
            sleep 10
          done
          echo "::error::Direct Container Apps API did not become reachable"
          exit 1

      - name: Build frontend
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          # First-party same-origin API: Static Web Apps proxies /api/* to the
          # linked Container App, keeping the session cookie first-party.
          VITE_API_BASE_URL="/api" npm run build

      - name: Get Static Web Apps deployment token
        id: swa-token
        run: |
          set -euo pipefail
          token="$(az staticwebapp secrets list --name nexora-frontend-dev --resource-group nexora-rg-dev --query properties.apiKey -o tsv)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Azure did not return a Static Web Apps deployment token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Verify production
        env:
          ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          COOKIE_JAR="$RUNNER_TEMP/nexora-production-cookies.txt"
          LOGIN_HEADERS="$RUNNER_TEMP/nexora-login-headers.txt"
          LOGIN_HEADERS_NORMALIZED="$RUNNER_TEMP/nexora-login-headers-normalized.txt"
          CORS_HEADERS="$RUNNER_TEMP/nexora-cors-headers.txt"
          CORS_HEADERS_NORMALIZED="$RUNNER_TEMP/nexora-cors-headers-normalized.txt"

          wait_for_status() {
            local url="$1"
            local expected="$2"
            local label="$3"
            local code=""
            for attempt in $(seq 1 30); do
              code="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = "$expected" ]; then
                echo "$label: HTTP $code"
                return 0
              fi
              echo "$label not ready (HTTP $code, expected $expected), attempt $attempt/30"
              sleep 10
            done
            echo "::error::$label did not return HTTP $expected"
            return 1
          }

          wait_for_status "$FRONTEND_URL/" "200" "Frontend"
          wait_for_status "$BACKEND_URL/api/healthz" "200" "API health (direct)"
          wait_for_status "$BACKEND_URL/api/readyz" "200" "Database readiness (direct)"
          wait_for_status "$BACKEND_URL/api/edit-access/verify" "405" "Protected Edit route (direct)"

          # First-party path: the browser only ever talks to $FRONTEND_URL/api,
          # which Static Web Apps proxies to the linked Container App. Static
          # Web Apps forwards the linked-backend path verbatim, so /api/healthz
          # must reach the backend's /api/healthz. Diagnose both shapes so a
          # first failed run tells us exactly how the proxy rewrites paths.
          echo "SWA /api/healthz  -> $(curl -s -o /dev/null -w '%{http_code}' "$FRONTEND_URL/api/healthz")"
          echo "SWA /healthz      -> $(curl -s -o /dev/null -w '%{http_code}' "$FRONTEND_URL/healthz")"
          wait_for_status "$FRONTEND_URL/api/healthz" "200" "First-party API via Static Web Apps"
          API="$FRONTEND_URL/api"

          RUNTIME_FRONTEND_URL="$(az containerapp show \
            -g nexora-rg-dev \
            -n nexora-backend-dev \
            --query "properties.template.containers[0].env[?name=='FRONTEND_URL'].value | [0]" \
            -o tsv)"
          if [ "$RUNTIME_FRONTEND_URL" != "$FRONTEND_URL" ]; then
            echo "::error::Container App FRONTEND_URL does not match deployed Static Web Apps origin"
            echo "Expected frontend origin: $FRONTEND_URL"
            echo "Runtime frontend origin: ${RUNTIME_FRONTEND_URL:-<empty>}"
            exit 1
          fi

          CORS_CODE="$(curl --silent --show-error --output /dev/null --dump-header "$CORS_HEADERS" \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: $FRONTEND_URL" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            "$BACKEND_URL/api/auth/login")"
          tr -d '\r' < "$CORS_HEADERS" > "$CORS_HEADERS_NORMALIZED"
          if [ "$CORS_CODE" != "200" ]; then
            echo "::error::Production login CORS preflight returned HTTP $CORS_CODE"
            grep -Ei '^(access-control-|vary:)' "$CORS_HEADERS_NORMALIZED" || true
            exit 1
          fi
          if ! grep -Fqi "access-control-allow-origin: $FRONTEND_URL" "$CORS_HEADERS_NORMALIZED"; then
            echo "::error::Production CORS preflight did not return the exact frontend Access-Control-Allow-Origin"
            grep -Ei '^(access-control-|vary:)' "$CORS_HEADERS_NORMALIZED" || true
            exit 1
          fi
          if ! grep -Fqi 'access-control-allow-credentials: true' "$CORS_HEADERS_NORMALIZED"; then
            echo "::error::Production CORS preflight did not allow credentials"
            grep -Ei '^(access-control-|vary:)' "$CORS_HEADERS_NORMALIZED" || true
            exit 1
          fi
          echo "Production CORS preflight: HTTP 200 with exact origin and credentials"

          # Everything below hits the SAME origin the browser uses: $API == $FRONTEND_URL/api.
          LOGIN_PAYLOAD="$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
          LOGIN_CODE="$(curl --silent --show-error \
            --dump-header "$LOGIN_HEADERS" \
            --cookie-jar "$COOKIE_JAR" \
            --header "Origin: $FRONTEND_URL" \
            --header 'Content-Type: application/json' \
            --data "$LOGIN_PAYLOAD" \
            --output "$RUNNER_TEMP/login.json" \
            --write-out '%{http_code}' \
            "$API/auth/login")"
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "::error::First-party login returned HTTP $LOGIN_CODE"
            if ! jq -c '{detail: .detail?, error: .error?}' "$RUNNER_TEMP/login.json"; then
              echo 'Unable to parse production login error body.'
            fi
            exit 1
          fi

          tr -d '\r' < "$LOGIN_HEADERS" > "$LOGIN_HEADERS_NORMALIZED"
          SESSION_COOKIE_HEADER="$(grep -Ei '^set-cookie:[[:space:]]*nexora_session=' "$LOGIN_HEADERS_NORMALIZED" | head -n 1 || true)"
          if [ -z "$SESSION_COOKIE_HEADER" ]; then
            echo "::error::First-party login did not issue the nexora_session cookie"
            exit 1
          fi
          SESSION_COOKIE_ATTRIBUTES="${SESSION_COOKIE_HEADER#*:}"
          for attr in Secure HttpOnly 'Path=/'; do
            if ! grep -Eiq "(^|;[[:space:]]*)${attr}([;[:space:]]|\$)" <<< "$SESSION_COOKIE_ATTRIBUTES"; then
              echo "::error::Production session cookie is missing $attr"
              echo 'set-cookie: [redacted]'
              exit 1
            fi
          done
          # First-party proxy: SameSite None or Lax are both acceptable; a
          # missing SameSite (defaults to Lax) is fine too.
          echo "Production session cookie: Secure + HttpOnly + Path=/ verified (first-party)"

          call_authed() {
            local label="$1" expected="$2" path="$3"
            local out="$RUNNER_TEMP/authed-$(echo "$label" | tr -cs 'A-Za-z0-9' '-').json"
            local code
            code="$(curl --silent --show-error \
              --cookie "$COOKIE_JAR" \
              --header "Origin: $FRONTEND_URL" \
              --output "$out" \
              --write-out '%{http_code}' \
              "$API$path")"
            if [ "$code" != "$expected" ]; then
              echo "::error::$label returned HTTP $code (expected $expected) for $path"
              head -c 600 "$out" || true
              echo
              exit 1
            fi
            echo "$label: HTTP $code" >&2
            echo "$out"
          }

          ME_JSON="$(call_authed 'auth/me' 200 '/auth/me')"
          jq -e '.email and .roles' "$ME_JSON" >/dev/null

          COMPANIES_JSON="$(call_authed 'master-data/companies' 200 '/master-data/companies')"
          jq -e 'type == "array"' "$COMPANIES_JSON" >/dev/null
          COMPANY_COUNT="$(jq 'length' "$COMPANIES_JSON")"
          echo "Companies visible to Administrator: $COMPANY_COUNT"
          if [ "$COMPANY_COUNT" -lt 1 ]; then
            echo "::error::Administrator sees zero companies in production; /proyectos, /finanzas/contabilidad and /control/configuracion will all fail"
            exit 1
          fi
          COMPANY_ID="$(jq -r '.[0].id' "$COMPANIES_JSON")"

          call_authed 'projects' 200 "/projects?company_id=$COMPANY_ID" >/dev/null
          ACCOUNTS_JSON="$(call_authed 'master-data/accounts' 200 "/master-data/accounts?companyId=$COMPANY_ID")"
          jq -e 'type == "array"' "$ACCOUNTS_JSON" >/dev/null

          DASHBOARD_JSON="$(call_authed 'dashboard/summary' 200 '/dashboard/summary')"
          jq -e '.currency == "HNL"' "$DASHBOARD_JSON" >/dev/null

          # Fiscal period read (returns 200 with nulls when not configured).
          call_authed 'fiscal/periods/current' 200 "/fiscal/periods/current?companyId=$COMPANY_ID" >/dev/null

          if [ "${EDIT_ACCESS_FALLBACK:-false}" = "true" ]; then
            EDIT_PAYLOAD="$(jq -n --arg token "$ADMIN_PASSWORD" '{token:$token}')"
            curl --fail --silent --show-error \
              --cookie "$COOKIE_JAR" \
              --header "Origin: $FRONTEND_URL" \
              --header 'Content-Type: application/json' \
              --data "$EDIT_PAYLOAD" \
              "$API/edit-access/verify" > "$RUNNER_TEMP/edit-access.json"
            jq -e '.capability and .expiresAt and .usesRemaining' "$RUNNER_TEMP/edit-access.json" >/dev/null
          fi

          # Session survives logout + relogin.
          LOGOUT_CODE="$(curl --silent --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
            --header "Origin: $FRONTEND_URL" --request POST \
            --output /dev/null --write-out '%{http_code}' "$API/auth/logout")"
          echo "auth/logout: HTTP $LOGOUT_CODE"
          POST_LOGOUT_ME="$(curl --silent --cookie "$COOKIE_JAR" --header "Origin: $FRONTEND_URL" \
            --output /dev/null --write-out '%{http_code}' "$API/auth/me")"
          if [ "$POST_LOGOUT_ME" != "401" ]; then
            echo "::error::auth/me after logout returned HTTP $POST_LOGOUT_ME (expected 401)"
            exit 1
          fi
          RELOGIN_CODE="$(curl --silent --cookie-jar "$COOKIE_JAR" \
            --header "Origin: $FRONTEND_URL" --header 'Content-Type: application/json' \
            --data "$LOGIN_PAYLOAD" --output /dev/null --write-out '%{http_code}' "$API/auth/login")"
          if [ "$RELOGIN_CODE" != "200" ]; then
            echo "::error::Relogin returned HTTP $RELOGIN_CODE"
            exit 1
          fi
          call_authed 'auth/me (relogin)' 200 '/auth/me' >/dev/null
          echo "logout + relogin: verified"

          {
            echo "### Production verification (first-party /api via Static Web Apps)"
            echo "- Frontend: $FRONTEND_URL"
            echo "- Backend revision: healthy, image = \`${{ github.sha }}\`"
            echo "- Direct HTTPS API + first-party \`$FRONTEND_URL/api\`: healthy"
            echo "- CORS + credentialed session cookie (Secure + HttpOnly + Path=/): verified"
            echo "- auth/me, master-data/companies ($COMPANY_COUNT visible), projects, master-data/accounts, dashboard (HNL), fiscal/periods/current: HTTP 200"
            echo "- logout invalidates session; relogin succeeds"
          } >> "$GITHUB_STEP_SUMMARY"
