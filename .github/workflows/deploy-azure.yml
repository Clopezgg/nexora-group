name: Deploy Azure

on:
  pull_request:
    paths:
      - "infra/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-azure.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Confirmo que este run puede desplegar recursos Azure DEV"
        required: true
        type: boolean
        default: false
      reason:
        description: "Motivo o cambio que autoriza este despliegue"
        required: true
        type: string
        default: "Despliegue manual autorizado"

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: nexora-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Bicep what-if
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      BACKEND_SECRET_KEY: ${{ secrets.BACKEND_SECRET_KEY }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      EDIT_ACCESS_TOKEN_SALT: ${{ secrets.EDIT_ACCESS_TOKEN_SALT }}
      EDIT_ACCESS_TOKEN_DIGEST: ${{ secrets.EDIT_ACCESS_TOKEN_DIGEST }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required deployment secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID POSTGRES_ADMIN_PASSWORD BACKEND_SECRET_KEY BOOTSTRAP_ADMIN_PASSWORD BOOTSTRAP_ADMIN_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret $name is not configured"
              exit 1
            fi
          done
          if { [ -n "$EDIT_ACCESS_TOKEN_SALT" ] && [ -z "$EDIT_ACCESS_TOKEN_DIGEST" ]; } || { [ -z "$EDIT_ACCESS_TOKEN_SALT" ] && [ -n "$EDIT_ACCESS_TOKEN_DIGEST" ]; }; then
            echo "::error::EDIT_ACCESS_TOKEN_SALT and EDIT_ACCESS_TOKEN_DIGEST must be configured together"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare validation Protected Edit credentials
        run: |
          set -euo pipefail
          if [ -n "$EDIT_ACCESS_TOKEN_SALT" ] && [ -n "$EDIT_ACCESS_TOKEN_DIGEST" ]; then
            exit 0
          fi
          IFS=$'\t' read -r DERIVED_SALT DERIVED_DIGEST < <(
            python -c 'import base64,hashlib,os,secrets; pin=os.environ["BOOTSTRAP_ADMIN_PASSWORD"]; salt=secrets.token_bytes(16); digest=hashlib.pbkdf2_hmac("sha256", pin.encode(), salt, 250000); print(base64.urlsafe_b64encode(salt).decode()+"\t"+base64.urlsafe_b64encode(digest).decode())'
          )
          echo "::add-mask::$DERIVED_SALT"
          echo "::add-mask::$DERIVED_DIGEST"
          echo "EDIT_ACCESS_TOKEN_SALT=$DERIVED_SALT" >> "$GITHUB_ENV"
          echo "EDIT_ACCESS_TOKEN_DIGEST=$DERIVED_DIGEST" >> "$GITHUB_ENV"

      - name: What-if (no crea recursos)
        run: |
          set -euo pipefail
          az deployment sub what-if \
            --name nexora-ci-whatif \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              backendSecretKey="$BACKEND_SECRET_KEY" \
              bootstrapAdminPassword="$BOOTSTRAP_ADMIN_PASSWORD" \
              bootstrapAdminEmail="$BOOTSTRAP_ADMIN_EMAIL" \
              editAccessTokenSalt="$EDIT_ACCESS_TOKEN_SALT" \
              editAccessTokenDigest="$EDIT_ACCESS_TOKEN_DIGEST"

  deploy:
    name: Deploy infra + apps
    needs: validate
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      BACKEND_SECRET_KEY: ${{ secrets.BACKEND_SECRET_KEY }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      EDIT_ACCESS_TOKEN_SALT: ${{ secrets.EDIT_ACCESS_TOKEN_SALT }}
      EDIT_ACCESS_TOKEN_DIGEST: ${{ secrets.EDIT_ACCESS_TOKEN_DIGEST }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Record deployment authorization
        env:
          DEPLOY_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || github.event.head_commit.message }}
        run: |
          {
            echo "### Deployment authorization"
            echo "- Requested by: ${{ github.actor }}"
            echo "- Reason: $DEPLOY_REASON"
            echo "- Target: Azure DEV (nexora-rg-dev)"
            echo "- SHA: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Prepare Protected Edit credentials
        run: |
          set -euo pipefail
          if [ -n "$EDIT_ACCESS_TOKEN_SALT" ] && [ -n "$EDIT_ACCESS_TOKEN_DIGEST" ]; then
            echo "EDIT_ACCESS_FALLBACK=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$EDIT_ACCESS_TOKEN_SALT" ] || [ -n "$EDIT_ACCESS_TOKEN_DIGEST" ]; then
            echo "::error::EDIT_ACCESS_TOKEN_SALT and EDIT_ACCESS_TOKEN_DIGEST must be configured together"
            exit 1
          fi
          IFS=$'\t' read -r DERIVED_SALT DERIVED_DIGEST < <(
            python -c 'import base64,hashlib,os,secrets; pin=os.environ["BOOTSTRAP_ADMIN_PASSWORD"]; salt=secrets.token_bytes(16); digest=hashlib.pbkdf2_hmac("sha256", pin.encode(), salt, 250000); print(base64.urlsafe_b64encode(salt).decode()+"\t"+base64.urlsafe_b64encode(digest).decode())'
          )
          echo "::add-mask::$DERIVED_SALT"
          echo "::add-mask::$DERIVED_DIGEST"
          echo "EDIT_ACCESS_TOKEN_SALT=$DERIVED_SALT" >> "$GITHUB_ENV"
          echo "EDIT_ACCESS_TOKEN_DIGEST=$DERIVED_DIGEST" >> "$GITHUB_ENV"
          echo "EDIT_ACCESS_FALLBACK=true" >> "$GITHUB_ENV"

      - name: Build and push backend image to GHCR
        run: |
          set -euo pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/nexora-backend:${{ github.sha }}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run database migrations
        run: |
          set -euo pipefail
          RG=nexora-rg-dev
          POSTGRES_FQDN="$(az postgres flexible-server list -g "$RG" --query '[0].fullyQualifiedDomainName' -o tsv)"
          if [ -z "$POSTGRES_FQDN" ] || [ "$POSTGRES_FQDN" = "null" ]; then
            echo "::error::PostgreSQL FQDN could not be resolved"
            exit 1
          fi
          ENCODED_PASSWORD="$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_ADMIN_PASSWORD"], safe=""))')"
          DATABASE_URL="postgresql+psycopg://nexoraadmin:${ENCODED_PASSWORD}@${POSTGRES_FQDN}:5432/nexora?sslmode=require"
          echo "::add-mask::$DATABASE_URL"
          docker run --rm \
            --env DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" \
            sh -ec 'python -u -m app.pre_migration_repairs && alembic upgrade head'

      - name: Deploy infrastructure and backend
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "nexora-deploy-${{ github.run_number }}" \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              backendSecretKey="$BACKEND_SECRET_KEY" \
              bootstrapAdminPassword="$BOOTSTRAP_ADMIN_PASSWORD" \
              bootstrapAdminEmail="$BOOTSTRAP_ADMIN_EMAIL" \
              editAccessTokenSalt="$EDIT_ACCESS_TOKEN_SALT" \
              editAccessTokenDigest="$EDIT_ACCESS_TOKEN_DIGEST" \
              backendImage="$IMAGE"

      - name: Relink Static Web Apps backend through GA CLI
        run: |
          set -euo pipefail
          RG=nexora-rg-dev
          SWA=nexora-frontend-dev
          DEPLOYMENT_NAME="nexora-deploy-${{ github.run_number }}"
          BACKEND_RESOURCE_ID="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.backendResourceId.value -o tsv)"
          if [ -z "$BACKEND_RESOURCE_ID" ] || [ "$BACKEND_RESOURCE_ID" = "null" ]; then
            echo "::error::Backend resource ID was not returned by deployment"
            exit 1
          fi

          # Remove the historical raw ARM link and its generated auth state, then
          # let the GA Static Web Apps command establish the supported handshake.
          az staticwebapp backends unlink \
            --name "$SWA" \
            --resource-group "$RG" \
            --environment-name default \
            --remove-backend-auth \
            --only-show-errors \
            >/dev/null 2>&1 || true

          az staticwebapp backends validate \
            --name "$SWA" \
            --resource-group "$RG" \
            --environment-name default \
            --backend-resource-id "$BACKEND_RESOURCE_ID" \
            --backend-region eastus2 \
            --only-show-errors \
            >/dev/null

          az staticwebapp backends link \
            --name "$SWA" \
            --resource-group "$RG" \
            --environment-name default \
            --backend-resource-id "$BACKEND_RESOURCE_ID" \
            --backend-region eastus2 \
            --only-show-errors \
            >/dev/null

          LINKED_ID="$(az staticwebapp backends show --name "$SWA" --resource-group "$RG" --environment-name default --query backendResourceId -o tsv 2>/dev/null || true)"
          if [ -z "$LINKED_ID" ]; then
            LINKED_ID="$(az staticwebapp backends show --name "$SWA" --resource-group "$RG" --environment-name default --query properties.backendResourceId -o tsv 2>/dev/null || true)"
          fi
          if [ -z "$LINKED_ID" ] || [ "$LINKED_ID" = "null" ]; then
            echo "::error::Static Web Apps backend link could not be verified"
            exit 1
          fi
          echo "Static Web Apps backend linked through supported GA command"

      - name: Capture deployed endpoints
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="nexora-deploy-${{ github.run_number }}"
          FRONTEND_HOSTNAME="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.frontendHostname.value -o tsv)"
          BACKEND_FQDN="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.backendFqdn.value -o tsv)"
          EDIT_ACCESS_CONFIGURED="$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.editAccessConfigured.value -o tsv)"
          DEPLOYED_IMAGE="$(az containerapp show -g nexora-rg-dev -n nexora-backend-dev --query 'properties.template.containers[0].image' -o tsv)"
          MIN_REPLICAS="$(az containerapp show -g nexora-rg-dev -n nexora-backend-dev --query 'properties.template.scale.minReplicas' -o tsv)"
          [ -n "$FRONTEND_HOSTNAME" ] && [ -n "$BACKEND_FQDN" ]
          [[ "$DEPLOYED_IMAGE" == *"${{ github.sha }}"* ]]
          [ "$MIN_REPLICAS" = "1" ]
          [ "${EDIT_ACCESS_CONFIGURED,,}" = "true" ]
          echo "FRONTEND_URL=https://$FRONTEND_HOSTNAME" >> "$GITHUB_ENV"
          echo "BACKEND_URL=https://$BACKEND_FQDN" >> "$GITHUB_ENV"

      - name: Verify newest backend revision is healthy
        run: |
          set -euo pipefail
          APP=nexora-backend-dev
          RG=nexora-rg-dev
          EXPECTED_SHA="${{ github.sha }}"
          for attempt in $(seq 1 36); do
            LATEST_REVISION="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)"
            READY_REVISION="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv)"
            HEALTH="$(az containerapp revision list -g "$RG" -n "$APP" --query "[?name=='$LATEST_REVISION'] | [0].properties.healthState" -o tsv)"
            REV_IMAGE="$(az containerapp revision list -g "$RG" -n "$APP" --query "[?name=='$LATEST_REVISION'] | [0].properties.template.containers[0].image" -o tsv)"
            echo "attempt=$attempt latest=$LATEST_REVISION ready=$READY_REVISION health=$HEALTH"
            if [ -n "$LATEST_REVISION" ] && [ "$LATEST_REVISION" = "$READY_REVISION" ] && [ "$HEALTH" = "Healthy" ] && [[ "$REV_IMAGE" == *"$EXPECTED_SHA"* ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Newest backend revision never became healthy/ready"
          az containerapp revision list -g "$RG" -n "$APP" --query '[].{name:name,active:properties.active,health:properties.healthState,image:properties.template.containers[0].image}' -o table || true
          exit 1

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build

      - name: Get Static Web Apps deployment token
        id: swa-token
        run: |
          set -euo pipefail
          token="$(az staticwebapp secrets list --name nexora-frontend-dev --resource-group nexora-rg-dev --query properties.apiKey -o tsv)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Azure did not return a Static Web Apps deployment token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Verify production
        env:
          ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          COOKIE_JAR="$RUNNER_TEMP/nexora-production-cookies.txt"

          wait_for_status() {
            local url="$1"
            local expected="$2"
            local label="$3"
            local code=""
            for attempt in $(seq 1 30); do
              code="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = "$expected" ]; then
                echo "$label: HTTP $code"
                return 0
              fi
              echo "$label not ready (HTTP $code, expected $expected), attempt $attempt/30"
              sleep 10
            done
            echo "::error::$label did not return HTTP $expected"
            return 1
          }

          wait_for_status "$FRONTEND_URL/" "200" "Frontend"
          wait_for_status "$FRONTEND_URL/api/healthz" "200" "Same-origin API health"
          wait_for_status "$FRONTEND_URL/api/readyz" "200" "Database readiness"
          wait_for_status "$FRONTEND_URL/api/edit-access/verify" "405" "Protected Edit route"

          LOGIN_PAYLOAD="$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
          curl --fail --silent --show-error \
            --cookie-jar "$COOKIE_JAR" \
            --header 'Content-Type: application/json' \
            --data "$LOGIN_PAYLOAD" \
            "$FRONTEND_URL/api/auth/login" > "$RUNNER_TEMP/login.json"

          curl --fail --silent --show-error \
            --cookie "$COOKIE_JAR" \
            "$FRONTEND_URL/api/dashboard/summary" > "$RUNNER_TEMP/dashboard-summary.json"
          jq -e '.currency == "HNL"' "$RUNNER_TEMP/dashboard-summary.json" >/dev/null

          if [ "${EDIT_ACCESS_FALLBACK:-false}" = "true" ]; then
            EDIT_PAYLOAD="$(jq -n --arg token "$ADMIN_PASSWORD" '{token:$token}')"
            curl --fail --silent --show-error \
              --cookie "$COOKIE_JAR" \
              --header 'Content-Type: application/json' \
              --data "$EDIT_PAYLOAD" \
              "$FRONTEND_URL/api/edit-access/verify" > "$RUNNER_TEMP/edit-access.json"
            jq -e '.capability and .expiresAt and .usesRemaining' "$RUNNER_TEMP/edit-access.json" >/dev/null
          fi

          {
            echo "### Production verification"
            echo "- Frontend: $FRONTEND_URL"
            echo "- Backend revision: healthy"
            echo "- Same-origin API: healthy"
            echo "- Database readiness: healthy"
            echo "- Authenticated dashboard: healthy"
            echo "- HNL contract: verified"
            echo "- Protected Edit: verified"
          } >> "$GITHUB_STEP_SUMMARY"
