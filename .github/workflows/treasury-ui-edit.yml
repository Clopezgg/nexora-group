name: Apply Treasury account UI patch

on:
  push:
    branches:
      - fix/treasury-account-ui
    paths:
      - ".github/workflows/treasury-ui-edit.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/treasury-account-ui
          fetch-depth: 1

      - name: Apply focused Treasury changes
        run: python scripts/treasury_ui_patch.py

      - name: Validate patch
        run: git diff --check

      - name: Commit changes and remove temporary patch files
        run: |
          git config user.name "Nexora Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/treasury-ui-edit.yml scripts/treasury_ui_patch.py
          git add frontend/src/features/treasury/TreasuryPage.tsx frontend/src/services/treasuryService.ts frontend/tests/TreasuryPage.test.tsx backend/app/services/treasury_service.py backend/tests/test_treasury.py
          git commit -m "feat(treasury): create company treasury accounts from UI"
          git push origin HEAD:fix/treasury-account-ui
