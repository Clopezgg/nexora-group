name: Apply treasury financial flow fixes

on:
  push:
    branches:
      - fix/treasury-financial-flows

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrections
        run: python scripts/apply_financial_flow_fixes.py
      - name: Commit corrected flows
        run: |
          git config user.name "Nexora Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(treasury): correct remittance expense payment and collection flows"
          git push origin HEAD:fix/treasury-financial-flows
