name: Temporary scoped SAP mobile geometry repair
on:
  push:
    branches:
      - audit/visual-shell-root-cause-v2-20260918
    paths:
      - .github/workflows/nexora-mobile-geometry-repair-once.yml
permissions:
  contents: write
jobs:
  scoped-repair:
    if: github.repository == 'Clopezgg/nexora-group' && github.ref == 'refs/heads/audit/visual-shell-root-cause-v2-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Repair SAP shell grid and assert real non-overlap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def change(path, old, new):
              file = Path(path)
              content = file.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one source anchor, found {content.count(old)}')
              file.write_text(content.replace(old, new, 1))
          path='frontend/src/sap-gui/components/SapWorkstation.css'
          change(path,
                 '@media (max-width: 768px) {\n  .nx-sap-statusbar {',
                 '@media (max-width: 768px) {\n  /* Mobile chrome is two real rows; do not squeeze 40px controls into the\n     desktop 34px command row or 25px menu row. Geometry owns these tokens. */\n  .nx-sap-workstation {\n    --sap-menu-height: 40px;\n    --sap-command-height: 88px;\n    --sap-toolbar-height: 40px;\n    --sap-status-height: 28px;\n  }\n\n  .nx-sap-statusbar {')
          change(path,
                 '  .nx-sap-commandbar {\n    flex: 1 1 100%;\n    order: 3;\n    padding: 2px 4px;\n  }',
                 '  .nx-sap-commandbar {\n    flex: 1 1 100%;\n    order: 2;\n    height: 48px;\n    padding: 2px 4px;\n  }')
          change(path,
                 '  .nx-sap-toolbar {\n    flex: 1 1 100%;\n    width: 100%;\n    height: var(--sap-toolbar-height, 40px);',
                 '  .nx-sap-toolbar {\n    flex: 1 1 100%;\n    order: 1;\n    width: 100%;\n    height: var(--sap-toolbar-height, 40px);')
          path='frontend/e2e/sap-gui-visual.spec.ts'
          change(path,
                 "    await page.waitForLoadState('networkidle')\n    if (path === '/proyectos/cockpit') {",
                 "    await page.waitForLoadState('networkidle')\n    if (viewport.width <= 768) {\n      const chrome = await page.evaluate(() => {\n        const rect = (selector: string) => document.querySelector(selector)?.getBoundingClientRect()\n        const menu = rect('.nx-sap-menubar')\n        const command = rect('.nx-sap-commandrow')\n        const topbar = rect('.nx-sap-main .nx-topbar')\n        return {\n          menuBottom: menu?.bottom ?? -1, commandTop: command?.top ?? -1,\n          commandBottom: command?.bottom ?? -1, topbarTop: topbar?.top ?? -1,\n        }\n      })\n      expect(chrome.menuBottom, 'menú SAP no invade barra de comandos').toBeLessThanOrEqual(chrome.commandTop + 1)\n      expect(chrome.commandBottom, 'barra de comandos SAP no cubre Topbar').toBeLessThanOrEqual(chrome.topbarTop + 1)\n    }\n    if (path === '/proyectos/cockpit') {")
          Path('.github/workflows/nexora-mobile-geometry-repair-once.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/sap-gui/components/SapWorkstation.css frontend/e2e/sap-gui-visual.spec.ts .github/workflows/nexora-mobile-geometry-repair-once.yml
          git diff --cached --check
          git commit -m 'fix(ui): give mobile SAP chrome its own row geometry with overlap regression'
          git push origin HEAD:refs/heads/audit/visual-shell-root-cause-v2-20260918
