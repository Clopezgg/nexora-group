name: AI Code Review

permissions:
  contents: read
  pull-requests: write
  models: read

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Review pull request with ChatGPT-CodeReview
        uses: anc95/ChatGPT-CodeReview@8bd66227f057f21e847a8c27c9b356c25271d292
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_MODELS: "true"
          MODEL: openai/gpt-4o
          LANGUAGE: Spanish
          PROMPT: >-
            Revisa este cambio como un revisor senior de software empresarial. Prioriza errores funcionales,
            seguridad, autorización, integridad de datos, concurrencia, consistencia transaccional,
            regresiones, manejo de errores, contratos API, migraciones y riesgos de despliegue.
            Reporta solo hallazgos accionables y evita comentarios cosméticos o especulativos.
          MAX_PATCH_LENGTH: "30000"
          IGNORE_PATTERNS: >-
            **/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,
            **/*.lock,**/*.map,**/*.min.js,**/*.snap
